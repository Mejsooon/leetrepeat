<!doctype html>
<html lang="pl" class="lr-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetRepeat — Start</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="lr-header">
  <a class="lr-logo" href="/"><span class="lr-logo-mark">&lt;/&gt;</span><span class="lr-logo-name">LeetRepeat</span></a>
  <nav class="lr-nav">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Przełącz tryb jasny / ciemny"></button>
    <a href="/" class="active">Start</a>
    <a href="/list.html">Wszystkie zadania</a>
    <a href="/form.html" class="lr-nav-add">+ Dodaj zadanie</a>
  </nav>
</header>

<main class="page page-narrow" style="padding-top: 56px; gap: 32px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <p id="today" class="muted" style="font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase"></p>
    <h1 id="headline" style="font-size: 40px; letter-spacing: -0.02em">Do powtórki dziś: …</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
    <section class="card">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span class="chip chip-python" style="font-size: 13px">Python</span>
        <span id="python-total" class="muted" style="font-size: 13px"></span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span id="python-due" style="font-size: 56px; font-weight: 700; line-height: 1">–</span>
        <span style="color: var(--muted)">do powtórki</span>
      </div>
      <a id="python-go" class="btn" href="/task.html?session=python">Powtórz Python</a>
    </section>

    <section class="card">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span class="chip chip-csharp" style="font-size: 13px">C#</span>
        <span id="csharp-total" class="muted" style="font-size: 13px"></span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px">
        <span id="csharp-due" style="font-size: 56px; font-weight: 700; line-height: 1">–</span>
        <span style="color: var(--muted)">do powtórki</span>
      </div>
      <a id="csharp-go" class="btn" href="/task.html?session=csharp">Powtórz C#</a>
    </section>
  </div>

  <a id="all-go" class="btn btn-primary btn-big" href="/task.html?session=all">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
    <span id="all-label">Zacznij powtórkę — wszystkie języki</span>
  </a>

  <div id="done" class="card" style="align-items: center; text-align: center" hidden>
    <h2 style="font-size: 22px">Koniec na dziś 🎉</h2>
    <p class="muted">Nie masz już nic do powtórki. <a href="/list.html">Zobacz wszystkie zadania</a> albo <a href="/form.html">dodaj nowe</a>.</p>
  </div>

  <p id="error" class="banner banner-bad" hidden></p>
</main>

<script>
// Odmiana: 1 zadanie, 2–4 zadania, 5+ zadań (12–14 też "zadań")
function zadan(n) {
  if (n === 1) return "zadanie";
  if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) return "zadania";
  return "zadań";
}

var todayText = new Date().toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long" });
document.getElementById("today").textContent = todayText;

fetch("/api/summary")
  .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
  .then(function (summary) {
    var all = summary.python.due + summary.csharp.due;
    document.getElementById("headline").textContent = "Do powtórki dziś: " + all + " " + zadan(all);

    ["python", "csharp"].forEach(function (lang) {
      var s = summary[lang];
      document.getElementById(lang + "-due").textContent = s.due;
      document.getElementById(lang + "-total").textContent = s.total + " " + zadan(s.total) + " łącznie";
      // Przycisk języka bez zadań na dziś nie ma sensu — ukrywamy go
      document.getElementById(lang + "-go").hidden = s.due === 0;
    });

    document.getElementById("all-label").textContent = "Zacznij powtórkę — wszystkie języki (" + all + ")";
    document.getElementById("all-go").hidden = all === 0;
    document.getElementById("done").hidden = all !== 0;
  })
  .catch(function (err) {
    var box = document.getElementById("error");
    box.textContent = "Nie udało się pobrać danych z serwera (" + err.message + "). Czy serwer działa?";
    box.hidden = false;
  });
</script>
</body>
</html>
