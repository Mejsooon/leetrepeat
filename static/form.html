<!doctype html>
<html lang="pl" class="lr-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetRepeat — Nowe zadanie</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
</head>
<body>
<header class="lr-header">
  <a class="lr-logo" href="/"><span class="lr-logo-mark">&lt;/&gt;</span><span class="lr-logo-name">LeetRepeat</span></a>
  <nav class="lr-nav">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Przełącz tryb jasny / ciemny"></button>
    <a href="/">Start</a>
    <a href="/list.html">Wszystkie zadania</a>
    <a href="/form.html" class="lr-nav-add">+ Dodaj zadanie</a>
  </nav>
</header>

<main class="page page-narrow" style="padding-bottom: 56px">
  <h1 id="heading" style="font-size: 32px">Nowe zadanie</h1>

  <div class="field">
    <label for="title">Tytuł</label>
    <input id="title" class="input" type="text" placeholder="np. Odwróć listę">
    <span class="field-error" id="err-title" hidden></span>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 24px">
    <div class="field">
      <span class="label">Język</span>
      <div class="seg" role="group" aria-label="Język" id="seg-language">
        <button type="button" data-value="python" class="on">Python</button>
        <button type="button" data-value="csharp">C#</button>
      </div>
    </div>
    <div class="field">
      <span class="label">Typ zadania</span>
      <div class="seg" role="group" aria-label="Typ zadania" id="seg-kind">
        <button type="button" data-value="function" class="on">function — wywołanie funkcji</button>
        <button type="button" data-value="program">program — wejście / wyjście</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="description">Treść <span style="color: var(--subtle); font-weight: 400">(Markdown)</span></label>
    <textarea id="description" class="textarea" rows="5" placeholder="Co ma zostać zrobione? Możesz używać `kodu` i **pogrubienia**."></textarea>
    <span class="field-error" id="err-description" hidden></span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
    <div class="field">
      <span class="label">Kod startowy</span>
      <div id="starter-editor" class="editor-small"></div>
    </div>
    <div class="field">
      <label for="hint">Podpowiedź</label>
      <textarea id="hint" class="textarea" rows="6"></textarea>
    </div>
  </div>

  <div class="field">
    <span class="label">Rozwiązanie wzorcowe</span>
    <div id="solution-editor" class="editor-small" style="height: 200px"></div>
    <span class="field-error" id="err-solution" hidden></span>
  </div>

  <section class="card" style="padding: 20px; gap: 14px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
      <h2 style="font-size: 16px">Testy</h2>
      <span id="test-help" class="muted" style="font-size: 13px"></span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 44px; gap: 10px; color: var(--subtle); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em">
      <span id="col-input"></span><span id="col-expected"></span><span></span>
    </div>
    <div id="test-rows" style="display: flex; flex-direction: column; gap: 10px"></div>
    <button type="button" id="add-test" class="btn btn-dashed" style="align-self: flex-start">+ dodaj test</button>
    <span class="field-error" id="err-tests" hidden></span>
    <div id="check-output" style="display: flex; flex-direction: column; gap: 10px"></div>
  </section>

  <p id="error" class="banner banner-bad" hidden></p>

  <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end">
    <a href="/list.html" class="btn btn-ghost" style="border: none">Anuluj</a>
    <button type="button" id="check" class="btn btn-check">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
      <span id="check-label">Sprawdź rozwiązanie na testach</span>
    </button>
    <button type="button" id="save" class="btn btn-primary">Zapisz zadanie</button>
  </div>
</main>

<script src="/vendor/monaco/vs/loader.js"></script>
<script>
var params = new URLSearchParams(location.search);
var editId = params.get("id");
var language = "python";
var kind = "function";
var starterEditor = null;
var solutionEditor = null;
var MONACO_LANG = { python: "python", csharp: "csharp" };

// --- Przełączniki segmentowe (język, typ) ---
function setSeg(groupId, value) {
  document.querySelectorAll("#" + groupId + " button").forEach(function (b) {
    b.classList.toggle("on", b.dataset.value === value);
  });
}

// --- Wiersze testów: dla "program" wejście może mieć kilka linii, więc jest textarea ---
function addTestRow(inputValue, expectedValue) {
  var row = document.createElement("div");
  row.className = "test-row";
  row.style.cssText = "display: grid; grid-template-columns: 1fr 1fr 44px; gap: 10px; align-items: start";
  var input = document.createElement(kind === "program" ? "textarea" : "input");
  var expected = document.createElement(kind === "program" ? "textarea" : "input");
  [input, expected].forEach(function (el) {
    el.className = (kind === "program" ? "textarea" : "input") + " mono";
    if (kind === "program") el.rows = 2;
  });
  input.setAttribute("aria-label", "Wejście testu");
  expected.setAttribute("aria-label", "Oczekiwany wynik");
  input.value = inputValue || "";
  expected.value = expectedValue || "";
  var remove = document.createElement("button");
  remove.type = "button";
  remove.className = "btn btn-icon";
  remove.style.cssText = "width: 44px; height: 42px; min-height: 42px; border: 1px solid var(--input-border)";
  remove.setAttribute("aria-label", "Usuń test");
  remove.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg>';
  remove.addEventListener("click", function () { row.remove(); });
  row.appendChild(input);
  row.appendChild(expected);
  row.appendChild(remove);
  document.getElementById("test-rows").appendChild(row);
}

function readTests() {
  var tests = [];
  document.querySelectorAll(".test-row").forEach(function (row) {
    var fields = row.querySelectorAll("input, textarea");
    // Wiersz z dwoma pustymi polami pomijamy
    if (fields[0].value === "" && fields[1].value === "") return;
    tests.push({ input: fields[0].value, expected: fields[1].value });
  });
  return tests;
}

function applyKindLabels() {
  var fn = kind === "function";
  document.getElementById("col-input").textContent = fn ? "Wywołanie funkcji" : "Wejście (stdin)";
  document.getElementById("col-expected").textContent = fn ? "Oczekiwany wynik (JSON)" : "Oczekiwane wyjście (stdout)";
  document.getElementById("test-help").textContent = fn
    ? "Wynik porównywany jako JSON — [3, 2, 1] = [3,2,1]"
    : "Porównanie tekstu, bez spacji i pustych linii na końcu";
  // Przebudowanie wierszy z zachowaniem wpisanych wartości (zmienia się input ↔ textarea)
  var current = [];
  document.querySelectorAll(".test-row").forEach(function (row) {
    var fields = row.querySelectorAll("input, textarea");
    current.push([fields[0].value, fields[1].value]);
  });
  document.getElementById("test-rows").innerHTML = "";
  if (current.length === 0) current.push(["", ""]);
  current.forEach(function (pair) { addTestRow(pair[0], pair[1]); });
}

document.querySelectorAll("#seg-language button").forEach(function (b) {
  b.addEventListener("click", function () {
    language = b.dataset.value;
    setSeg("seg-language", language);
    if (starterEditor) {
      monaco.editor.setModelLanguage(starterEditor.getModel(), MONACO_LANG[language]);
      monaco.editor.setModelLanguage(solutionEditor.getModel(), MONACO_LANG[language]);
    }
  });
});
document.querySelectorAll("#seg-kind button").forEach(function (b) {
  b.addEventListener("click", function () {
    kind = b.dataset.value;
    setSeg("seg-kind", kind);
    applyKindLabels();
  });
});
document.getElementById("add-test").addEventListener("click", function () { addTestRow("", ""); });

// Odmiana: 1 test, 2–4 testy, 5+ testów
function testow(n) {
  if (n === 1) return "test";
  if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) return "testy";
  return "testów";
}

// --- Wyniki sprawdzenia (ten sam wygląd co na ekranie zadania) ---
function renderResults(container, results) {
  container.innerHTML = "";
  var passed = results.filter(function (r) { return r.status === "pass"; }).length;
  if (passed === results.length) {
    var ok = document.createElement("div");
    ok.className = "banner banner-ok";
    ok.textContent = "✓ Rozwiązanie wzorcowe przechodzi " + passed + " / " + results.length + " " + testow(results.length) + " — można zapisywać.";
    container.appendChild(ok);
    return;
  }
  var bad = document.createElement("div");
  bad.className = "banner banner-bad";
  bad.textContent = "Rozwiązanie wzorcowe przechodzi " + passed + " / " + results.length + " " +
    testow(results.length) + ". Sprawdź rozwiązanie albo pola expected.";
  container.appendChild(bad);
  var list = document.createElement("div");
  list.className = "results";
  results.forEach(function (r) {
    var box = document.createElement("div");
    box.className = "result result-" + r.status;
    var label = { pass: "✓ OK", fail: "✗ BŁĄD", error: "💥 WYJĄTEK", timeout: "⏱ CZAS" }[r.status];
    box.innerHTML = '<div class="result-row"><span class="result-label"></span><span class="in"></span></div>';
    box.querySelector(".result-label").textContent = label;
    box.querySelector(".in").textContent = r.input === "" ? "(puste wejście)" : r.input;
    if (r.status === "fail") {
      var d = document.createElement("div");
      d.className = "result-detail";
      d.innerHTML = 'oczekiwano <span class="ok-text"></span> · otrzymano <span class="bad-text"></span>';
      d.querySelector(".ok-text").textContent = r.expected;
      d.querySelector(".bad-text").textContent = r.actual;
      box.appendChild(d);
    } else if (r.status !== "pass") {
      var m = document.createElement("div");
      m.className = "result-detail";
      m.innerHTML = "<pre></pre>";
      m.querySelector("pre").textContent = r.message || "";
      box.appendChild(m);
    }
    list.appendChild(box);
  });
  container.appendChild(list);
}

document.getElementById("check").addEventListener("click", function () {
  var output = document.getElementById("check-output");
  var tests = readTests();
  if (tests.length === 0) {
    output.innerHTML = '<div class="banner banner-bad">Dodaj co najmniej jeden test.</div>';
    return;
  }
  var button = document.getElementById("check");
  button.disabled = true;
  document.getElementById("check-label").textContent =
    language === "csharp" ? "Uruchamiam… (C# kompiluje się kilka sekund)" : "Uruchamiam…";
  fetch("/api/run", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ language: language, kind: kind, code: solutionEditor.getValue(), tests: tests })
  })
    .then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "HTTP " + res.status);
        return data;
      });
    })
    .then(function (data) { renderResults(output, data.results); })
    .catch(function (err) {
      output.innerHTML = '<div class="banner banner-bad"></div>';
      output.firstChild.textContent = err.message;
    })
    .finally(function () {
      button.disabled = false;
      document.getElementById("check-label").textContent = "Sprawdź rozwiązanie na testach";
    });
});

// --- Zapis ---
var FIELD_ERRORS = { title: "err-title", description: "err-description", solution: "err-solution", tests: "err-tests" };

document.getElementById("save").addEventListener("click", function () {
  Object.keys(FIELD_ERRORS).forEach(function (name) {
    document.getElementById(FIELD_ERRORS[name]).hidden = true;
    var el = document.getElementById(name);
    if (el) el.classList.remove("invalid");
  });
  document.getElementById("error").hidden = true;

  var body = {
    title: document.getElementById("title").value.trim(),
    language: language,
    kind: kind,
    description: document.getElementById("description").value,
    starter_code: starterEditor.getValue(),
    hint: document.getElementById("hint").value,
    solution: solutionEditor.getValue(),
    tests: readTests()
  };
  fetch(editId ? "/api/tasks/" + editId : "/api/tasks", {
    method: editId ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  })
    .then(function (res) {
      if (res.ok) { location.href = "/list.html"; return; }
      return res.json().then(function (data) {
        if (res.status === 422 && Array.isArray(data.detail)) {
          data.detail.forEach(function (problem) {
            var field = problem.loc[1];
            var errId = FIELD_ERRORS[field];
            if (!errId) return;
            var span = document.getElementById(errId);
            span.textContent = field === "tests" ? "Dodaj co najmniej jeden test." : "To pole jest wymagane.";
            span.hidden = false;
            var el = document.getElementById(field);
            if (el) el.classList.add("invalid");
          });
          return;
        }
        throw new Error(typeof data.detail === "string" ? data.detail : "HTTP " + res.status);
      });
    })
    .catch(function (err) {
      var box = document.getElementById("error");
      box.textContent = "Nie udało się zapisać: " + err.message;
      box.hidden = false;
    });
});

// --- Start: edytory Monaco, potem (przy edycji) wczytanie zadania ---
applyKindLabels();
require.config({ paths: { vs: "/vendor/monaco/vs" } });
require(["vs/editor/editor.main"], function () {
  var options = {
    language: MONACO_LANG[language], theme: lrIsDark() ? "vs-dark" : "vs", automaticLayout: true,
    minimap: { enabled: false }, fontSize: 13, scrollBeyondLastLine: false, tabSize: 4
  };
  starterEditor = monaco.editor.create(document.getElementById("starter-editor"), Object.assign({ value: "" }, options));
  solutionEditor = monaco.editor.create(document.getElementById("solution-editor"), Object.assign({ value: "" }, options));
  window.addEventListener("themechange", function (e) {
    monaco.editor.setTheme(e.detail === "ciemny" ? "vs-dark" : "vs");
  });

  if (!editId) return;
  document.getElementById("heading").textContent = "Edytuj zadanie";
  document.title = "LeetRepeat — Edytuj zadanie";
  fetch("/api/tasks/" + editId)
    .then(function (res) { if (!res.ok) throw new Error(res.status === 404 ? "Nie ma takiego zadania" : "HTTP " + res.status); return res.json(); })
    .then(function (task) {
      document.getElementById("title").value = task.title;
      document.getElementById("description").value = task.description;
      document.getElementById("hint").value = task.hint;
      language = task.language;
      kind = task.kind;
      setSeg("seg-language", language);
      setSeg("seg-kind", kind);
      monaco.editor.setModelLanguage(starterEditor.getModel(), MONACO_LANG[language]);
      monaco.editor.setModelLanguage(solutionEditor.getModel(), MONACO_LANG[language]);
      starterEditor.setValue(task.starter_code);
      solutionEditor.setValue(task.solution);
      document.getElementById("test-rows").innerHTML = "";
      applyKindLabels();
      document.getElementById("test-rows").innerHTML = "";
      task.tests.forEach(function (t) { addTestRow(t.input, t.expected); });
    })
    .catch(function (err) {
      var box = document.getElementById("error");
      box.textContent = "Nie udało się wczytać zadania: " + err.message;
      box.hidden = false;
    });
});
</script>
</body>
</html>
